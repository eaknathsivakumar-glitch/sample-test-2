<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small hello from a warm corner of the internet."
    />
    <title>Hello, world — a warm welcome</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="welcome" aria-labelledby="welcome-title">
      <div class="welcome__orb welcome__orb--top" aria-hidden="true"></div>
      <div class="welcome__orb welcome__orb--bottom" aria-hidden="true"></div>

      <section class="welcome__content">
        <div class="welcome__mark" aria-hidden="true">
          <span class="welcome__mark-line"></span>
          <span class="welcome__mark-dot"></span>
          <span class="welcome__mark-line welcome__mark-line--short"></span>
        </div>

        <p class="welcome__eyebrow">A little corner of the internet</p>
        <h1 id="welcome-title">Hello,<br /><em>world.</em></h1>
        <p class="welcome__intro">
          It’s nice to have you here. Take a breath, stay a while, and make
          yourself at home.
        </p>

        <div class="welcome__footer" aria-label="Page note">
          <span class="welcome__footer-rule"></span>
          <span>Made with good energy</span>
          <span class="welcome__spark" aria-hidden="true">✦</span>
        </div>
      </section>
    </main>
  </body>
</html>
